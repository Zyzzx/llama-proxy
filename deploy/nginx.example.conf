# Optional front layer: TLS termination + multiple proxy instances.
# The proxy instances must be run with --workers 1 each (in-memory
# routing state); Nginx then load-balances at the connection level,
# which is fine because routing decisions are per-request anyway.

upstream llm_proxy {
    server 127.0.0.1:4000;
    server 127.0.0.1:4001;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name llm.example.com;

    ssl_certificate     /etc/ssl/llm/fullchain.pem;
    ssl_certificate_key /etc/ssl/llm/privkey.pem;

    # streaming: disable buffering so SSE chunks reach the client as they
    # are produced
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://llm_proxy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
